   <text style="font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #64748b" x="62.244" y="513.3744" transform="rotate(-0 62.244 513.3744)">完整验收还检查峰值/末端误差、完成时长、指令与积分边界等；13/13 为既定场景的结果。</text>
  </g>
  <g id="text_37">
   <text style="font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #64748b" x="62.244" y="531.6696" transform="rotate(-0 62.244 531.6696)">竖直 Kz=1.4 在本轮保持不变；升降 RMSE=3.094 cm，说明通过该测试，不说明 1.4 为最优值。</text>
  </g>
